name: movieflix
description: MovieFlix App
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  cached_network_image: ^3.3.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.2
  url_launcher: ^6.2.4
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  # 🔸- نسخة متوافقة مع win32 5 (لا تحتاج override)
  device_info_plus: ^10.1.0
  # 🔸- نسخة متوافقة مع win32 5
  package_info_plus: ^8.0.2
  # 🔸- نسخة متوافقة مع win32 5
  wakelock_plus: ^1.2.8

# 🔸- لا يوجد win32 في dependency_overrides — الحل النهائي
dependency_overrides:
  shared_preferences_android: '>=2.4.28 <2.5.0'

flutter:
  uses-material-design: true

dev_dependencies:
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
