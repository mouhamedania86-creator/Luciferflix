name: MovieFlix Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android + Android TV (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create \
              --template app \
              --platforms android \
              --org com.farescode \
              --project-name movieflix \
              .
          fi
          test -f android/app/src/main/AndroidManifest.xml
          echo "Android ready."

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Get dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Install Android TV banner
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          if [ -f assets/tv_banner.png ]; then
            cp assets/tv_banner.png android/app/src/main/res/drawable-nodpi/tv_banner.png
          else
            echo "WARNING: assets/tv_banner.png missing — using launcher icon as banner fallback"
          fi

      - name: Fix Android manifest
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")

          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET"/>',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>',
              '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>',
              '    <uses-permission android:name="android.permission.VIBRATE"/>',
              '    <uses-permission android:name="android.permission.WAKE_LOCK"/>',
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>',
              '    <uses-feature android:name="android.software.leanback" android:required="false"/>',
              '    <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>',
          ]
          for item in permissions:
              if item not in s:
                  s = s.replace("<application", item + "\n    <application", 1)

          if 'android:usesCleartextTraffic=' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)

          if 'android:hardwareAccelerated=' not in s:
              s = s.replace('<application', '<application android:hardwareAccelerated="true"', 1)

          # 👈 ذاكرة أكبر للتصفح (مهم لفيديو 4K / HEVC)
          if 'android:largeHeap=' not in s:
              s = s.replace('<application', '<application android:largeHeap="true"', 1)

          banner_ref = "@drawable/tv_banner" if Path("android/app/src/main/res/drawable-nodpi/tv_banner.png").exists() else "@mipmap/ic_launcher"
          if 'android:banner=' not in s:
              s = s.replace('<application', f'<application android:banner="{banner_ref}"', 1)

          if 'android.intent.category.LEANBACK_LAUNCHER' not in s:
              launcher = '<category android:name="android.intent.category.LAUNCHER"/>'
              if launcher in s:
                  s = s.replace(
                      launcher,
                      launcher + '\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>',
                      1,
                  )

          if 'io.flutter.embedding.android.EnableImpeller' not in s:
              meta = '''        <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false"/>
          <meta-data android:name="flutter.impeller.disabled" android:value="true"/>'''
              if '</activity>' in s:
                  s = s.replace('</activity>', meta + '\n        </activity>', 1)

          s = s.replace('android:label="movieflix"', 'android:label="MovieFlix"')
          p.write_text(s, encoding="utf-8")
          print("Manifest updated.")
          PY

      - name: Enable core library desugaring
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tool/patch_android_gradle.py ]; then
            python3 tool/patch_android_gradle.py
          else
            echo "No tool/patch_android_gradle.py — skipping"
          fi

      - name: Fix plugin Android Gradle config
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cache = Path.home() / ".pub-cache"
          patched = 0
          files = list(cache.glob("hosted/pub.dev/*/android/build.gradle")) + \
                  list(cache.glob("hosted/pub.dev/*/android/build.gradle.kts"))

          for p in files:
              s = p.read_text(encoding="utf-8")
              original = s
              s = s.replace("flutter.compileSdkVersion", "36")
              s = s.replace("flutter.minSdkVersion", "24")
              s = s.replace("flutter.targetSdkVersion", "36")
              s = re.sub(
                  r"jvmTarget\s*=\s*org\.jetbrains\.kotlin\.gradle\.dsl\.JvmTarget\.JVM_1_8",
                  "jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8)",
                  s,
              )
              s = re.sub(
                  r"jvmTarget\s*=\s*[\"']1\.8[\"']",
                  'jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8)',
                  s,
              )
              if s != original:
                  p.write_text(s, encoding="utf-8")
                  patched += 1
                  print(f"Patched {p}")
          print(f"Patched {patched} plugin file(s).")
          PY

      - name: Build phone APKs
        run: flutter build apk --release --no-shrink --split-per-abi

      - name: Save phone APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/apks
          cp -v build/app/outputs/flutter-apk/*.apk artifacts/apks/ 2>/dev/null || true
          ls -la artifacts/apks/

      - name: Build Android TV APK
        run: |
          flutter build apk --release --no-shrink \
            --target-platform android-arm,android-arm64

      - name: Rename TV APK
        shell: bash
        run: |
          set -euo pipefail
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            mv build/app/outputs/flutter-apk/app-release.apk artifacts/apks/MovieFlix-TV.apk
          fi
          echo "===== Final APKs ====="
          ls -lah artifacts/apks/

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: MovieFlix-APKs
          path: artifacts/apks/*.apk
          if-no-files-found: error

      - name: Diagnostics
        if: always()
        shell: bash
        run: |
          echo "===== APKs ====="
          ls -la artifacts/apks/ 2>/dev/null || true
          echo
          echo "===== Manifest ====="
          grep -E 'banner|LEANBACK|Impeller|cleartext|label=' android/app/src/main/AndroidManifest.xml 2>/dev/null || true

  windows:
    name: Windows (desktop)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows project
        shell: bash
        run: |
          if [ ! -f windows/runner/main.cpp ]; then
            flutter create --template app --platforms windows --org com.farescode --project-name movieflix .
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: MovieFlix-Windows
          path: build/windows/x64/runner/Release/**
          if-no-files-found: error
ios:
    name: iOS (unsigned IPA for ESign)
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS project
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            flutter create \
              --template app \
              --platforms ios \
              --org com.farescode \
              --project-name movieflix \
              .
          fi
          test -f ios/Runner.xcodeproj/project.pbxproj
          echo "iOS project ready."

      - name: Get dependencies
        run: flutter pub get

      - name: Fix Info.plist (HTTP + media for IPTV)
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib

          p = Path("ios/Runner/Info.plist")
          data = plistlib.loads(p.read_bytes())
          data["NSAppTransportSecurity"] = {
              "NSAllowsArbitraryLoads": True,
              "NSAllowsArbitraryLoadsInMedia": True,
              "NSAllowsArbitraryLoadsInWebContent": True,
          }
          data.setdefault(
              "NSPhotoLibraryAddUsageDescription",
              "لحفظ صورة من المشغل",
          )
          # اسم التطبيق على الشاشة
          data["CFBundleDisplayName"] = "MovieFlix"
          p.write_bytes(plistlib.dumps(data))
          print("Info.plist updated.")
          PY

      - name: Disable code signing (for ESign)
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("ios/Runner.xcodeproj/project.pbxproj")
          s = p.read_text(encoding="utf-8")
          # إلغاء التوقيع على CI
          s = re.sub(r"CODE_SIGN_STYLE = Automatic;", "CODE_SIGN_STYLE = Manual;", s)
          s = re.sub(r'DEVELOPMENT_TEAM = ".*?";', 'DEVELOPMENT_TEAM = "";', s)
          s = re.sub(r"DEVELOPMENT_TEAM = [A-Z0-9]+;", 'DEVELOPMENT_TEAM = "";', s)
          if "CODE_SIGNING_ALLOWED" not in s:
              s = s.replace(
                  "buildSettings = {",
                  'buildSettings = {\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;',
                  1,
              )
          # استبدال كل CODE_SIGNING_REQUIRED / ALLOWED
          s = re.sub(r"CODE_SIGNING_REQUIRED = YES;", "CODE_SIGNING_REQUIRED = NO;", s)
          s = re.sub(r"CODE_SIGNING_ALLOWED = YES;", "CODE_SIGNING_ALLOWED = NO;", s)
          p.write_text(s, encoding="utf-8")
          print("Signing disabled in pbxproj.")
          PY

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          test -d "$APP"
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload
          cp -R "$APP" build/ios/ipa/Payload/Runner.app
          (
            cd build/ios/ipa
            zip -qr ../MovieFlix-unsigned.ipa Payload
          )
          ls -lh build/ios/MovieFlix-unsigned.ipa
          # تحقق سريع
          unzip -l build/ios/MovieFlix-unsigned.ipa | head -20

      - name: Upload IPA for ESign
        uses: actions/upload-artifact@v4
        with:
          name: MovieFlix-iOS-unsigned
          path: build/ios/MovieFlix-unsigned.ipa
          if-no-files-found: error
